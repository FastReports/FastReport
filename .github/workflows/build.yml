name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    # net462 and net6.0-windows targets in this solution require the full .NET Framework
    # and WinForms, so the build must run on a Windows runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore
        run: dotnet restore FastReport.OpenSource.sln

      - name: Build
        run: dotnet build FastReport.OpenSource.sln -c Release --no-restore

      - name: Test
        run: dotnet test FastReport.OpenSource.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
